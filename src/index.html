<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>My Little Pawnies</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="stage">
      <div id="board"></div>
      <div id="places">
        <div id="hints"></div>
      </div>
    </div>

    <svg id="filters" width="0" height="0">
      <filter id="pixelate">
        <feFlood x="1" y="1" height="1" width="1" />
        <feComposite id="pixel-size" width="8" height="8" />
        <feTile result="grid" />
        <feComposite in="SourceGraphic" in2="grid" operator="in" />
        <feMorphology id="pixel-grow" operator="dilate" radius="4" />
      </filter>
    </svg>

    <div id="intro">
      <span class="word">bien</span>
      <span class="word">venue</span>
    </div>

    <div id="setup" class="hidden">
      <div id="setup-box">
        <label for="level">Adversaire</label>
        <select id="level">
          <option value="1">Débutant (~400 élo)</option>
          <option value="2" selected>Intermédiaire (~1500 élo)</option>
          <option value="3">Professionnel (~2500 élo)</option>
        </select>
        <button id="start">Débuter la partie</button>
      </div>
    </div>

    <div id="popup" class="hidden">
      <div id="popup-box">
        <div id="popup-card"></div>

        <div id="popup-choice">
          <input type="range" id="mood" min="0" max="2" step="1" value="1" />
          <div id="mood-labels">
            <span>Peureux</span>
            <span>Soumis</span>
            <span>Vaillants</span>
          </div>
          <button id="confirm">Valider</button>
        </div>
      </div>
    </div>

    <div id="duel" class="hidden">
      <div class="duel-side" id="duel-side-defender">
        <p class="duel-line" id="duel-line-defender">
          Hey, mais que fais-tu là? Il y a un cowboy de trop sur cette case...
        </p>
        <div class="duel-box" id="duel-box-defender">
          <div class="duel-slot" id="duel-defender"></div>
        </div>
      </div>

      <img id="duel-case" alt="case du duel" />

      <div class="duel-side" id="duel-side-intruder">
        <p class="duel-line" id="duel-line-intruder">
          Chuuuut, laisse-moi rester et ta mort sera indolore.
        </p>
        <div class="duel-box" id="duel-box-intruder">
          <div class="duel-slot" id="duel-intruder"></div>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
