<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>eikon parcel starter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body>
    <div id="board"></div>
    <div id="places">
      <div id="hints"></div>
    </div>
    <div id="setup">
      <label for="level">Adversaire</label>
      <select id="level">
        <option value="1">Débutant (~400 élo)</option>
        <option value="2" selected>Intermédiaire (~1500 élo)</option>
        <option value="3">Professionnel (~2500 élo)</option>
      </select>
      <button id="start">Débuter la partie</button>
    </div>

    <div id="popup" class="hidden">
      <div id="popup-box">
        <div id="popup-card"></div>

        <div id="popup-choice">
          <label>
            <input type="radio" name="mood" value="peureux" />
            Peureux
          </label>
          <label>
            <input type="radio" name="mood" value="vaillants" />
            Vaillants
          </label>
        </div>
      </div>
    </div>

    <script src="js/main.js" type="module"></script>
  </body>
</html>
